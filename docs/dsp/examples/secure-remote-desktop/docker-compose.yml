services:
  # Optional IdP — start with: docker compose --profile keycloak up -d
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "0.0.0.0:${KEYCLOAK_HTTP_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  keycloak-init:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-srd-realm.sh"]
    volumes:
      - ./keycloak/init-srd-realm.sh:/scripts/init-srd-realm.sh:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${OPENID_CLIENT_ID:-srd}
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID:-srd}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET:-}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI:-http://localhost:8081/remote-desktops/}
      USER_EMAIL: ${USER_EMAIL:-admin@srd.dsp.se}
      USER_PASSWORD: ${USER_PASSWORD:-admin}
    restart: "no"

  postgresql:
    image: postgres:16
    container_name: postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
      POSTGRES_USER: ${POSTGRES_USER:-guacamole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-guacamole_user} -d ${POSTGRES_DB:-guacamole_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Extract Guacamole JDBC schema SQL from the Guacamole image.
  guacamole-schema:
    image: guacamole/guacamole:latest
    container_name: guacamole-schema
    user: "0"
    entrypoint:
      - /bin/sh
      - -c
      - /opt/guacamole/bin/initdb.sh --postgresql > /schema/001-guacamole.sql
    volumes:
      - guacamole-initdb:/schema
    restart: "no"

  # Apply schema once, then set admin username/password from .env.
  guacamole-db-init:
    image: postgres:16
    container_name: guacamole-db-init
    depends_on:
      postgresql:
        condition: service_healthy
      guacamole-schema:
        condition: service_completed_successfully
    environment:
      PGHOST: postgresql
      PGUSER: ${POSTGRES_USER:-guacamole_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
      PGDATABASE: ${POSTGRES_DB:-guacamole_db}
      GUACAMOLE_ADMIN_USERNAME: ${GUACAMOLE_ADMIN_USERNAME:-guacadmin}
      GUACAMOLE_ADMIN_PASSWORD: ${GUACAMOLE_ADMIN_PASSWORD:-guacadmin}
    volumes:
      - guacamole-initdb:/schema:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        present=$$(psql -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='guacamole_user'")
        if [ "$$present" = "1" ]; then
          echo "Guacamole schema already present."
        else
          echo "Applying Guacamole schema..."
          psql -v ON_ERROR_STOP=1 -f /schema/001-guacamole.sql
          echo "Guacamole schema applied."
        fi

        # Guacamole hash = SHA-256( password + uppercase hex(salt) )
        SALT_HEX=$$(openssl rand -hex 32 | tr 'a-f' 'A-F')
        HASH_HEX=$$(printf '%s%s' "$$GUACAMOLE_ADMIN_PASSWORD" "$$SALT_HEX" | sha256sum | awk '{print toupper($$1)}')
        ADMIN_SQL=$$(printf '%s' "$$GUACAMOLE_ADMIN_USERNAME" | sed "s/'/''/g")

        # Rename default guacadmin when a different admin username is configured.
        if [ "$$GUACAMOLE_ADMIN_USERNAME" != "guacadmin" ]; then
          psql -v ON_ERROR_STOP=1 -c "\
        UPDATE guacamole_entity \
        SET name = '$${ADMIN_SQL}' \
        WHERE name = 'guacadmin' \
          AND type = 'USER' \
          AND NOT EXISTS ( \
            SELECT 1 FROM guacamole_entity WHERE name = '$${ADMIN_SQL}' AND type = 'USER' \
          );"
        fi

        psql -v ON_ERROR_STOP=1 -c "\
        UPDATE guacamole_user u \
        SET \
          password_salt = decode('$${SALT_HEX}', 'hex'), \
          password_hash = decode('$${HASH_HEX}', 'hex'), \
          password_date = CURRENT_TIMESTAMP, \
          disabled = FALSE, \
          expired = FALSE \
        FROM guacamole_entity e \
        WHERE u.entity_id = e.entity_id \
          AND e.type = 'USER' \
          AND e.name = '$${ADMIN_SQL}';"

        UPDATED=$$(psql -tA -c "SELECT COUNT(*) FROM guacamole_entity WHERE name = '$${ADMIN_SQL}' AND type = 'USER'")
        if [ "$$UPDATED" != "1" ]; then
          echo "ERROR: Guacamole admin user '$$GUACAMOLE_ADMIN_USERNAME' not found after schema init." >&2
          exit 1
        fi

        echo "Guacamole admin ready: $$GUACAMOLE_ADMIN_USERNAME"
    restart: "no"

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    ports:
      - "${GUACD_PORT:-4822}:4822"
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole_db}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-guacamole_user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-guacamole_password}
      # Database auth by default. Admin user/password: GUACAMOLE_ADMIN_* in .env.
      # Set OPENID_ENABLED=true and OPENID_* to use any OIDC provider (optional Keycloak).
      OPENID_ENABLED: ${OPENID_ENABLED:-false}
      OPENID_AUTHORIZATION_ENDPOINT: ${OPENID_AUTHORIZATION_ENDPOINT:-}
      OPENID_JWKS_ENDPOINT: ${OPENID_JWKS_ENDPOINT:-}
      OPENID_ISSUER: ${OPENID_ISSUER:-}
      OPENID_CLIENT_ID: ${OPENID_CLIENT_ID:-}
      OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET:-}
      OPENID_USERNAME_CLAIM_TYPE: ${OPENID_USERNAME_CLAIM_TYPE:-email}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI:-http://localhost:8081/remote-desktops/}
      OPENID_GROUPS_CLAIM_TYPE: ${OPENID_GROUPS_CLAIM_TYPE:-groups}
      EXTENSION_PRIORITY: ${EXTENSION_PRIORITY:-*}
      WEBAPP_CONTEXT: /remote-desktops
    ports:
      - "0.0.0.0:${GUACAMOLE_HTTP_PORT:-8081}:8080"
    depends_on:
      guacamole-db-init:
        condition: service_completed_successfully
      guacd:
        condition: service_started
    restart: unless-stopped

  # TLS reverse proxy. Start with: docker compose --profile tls up -d
  # Place fullchain.pem and privkey.pem in ./certs/
  proxy:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    container_name: srd-proxy
    depends_on:
      guacamole:
        condition: service_started
    environment:
      SERVER_NODENAME: ${SERVER_NODENAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        envsubst '$$SERVER_NODENAME' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    restart: unless-stopped

  # Ensure the home volume is owned by ubuntu (uid/gid 1000) with mode 700.
  remote-desktop-home-init:
    image: alpine:latest
    container_name: remote-desktop-home-init
    user: "0"
    volumes:
      - remote-desktop-home:/home/ubuntu
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 1000:1000 /home/ubuntu
        chmod 700 /home/ubuntu
    restart: "no"

  remote-desktop:
    image: ${REMOTE_DESKTOP_IMAGE:-maiacloudai/ubuntu-rdp:1.0}
    container_name: remote-desktop
    hostname: remote-desktop
    shm_size: 1g
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${REMOTE_DESKTOP_TZ:-Etc/UTC}
    ports:
      - "${REMOTE_DESKTOP_RDP_PORT:-3389}:3389"
      - "${REMOTE_DESKTOP_SSH_PORT:-2022}:2022"
    volumes:
      - remote-desktop-home:/home/ubuntu
    depends_on:
      remote-desktop-home-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  keycloak-data:
  postgres-data:
  guacamole-initdb:
  remote-desktop-home:
